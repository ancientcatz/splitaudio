name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK (ANDROID_HOME); make sure the two pieces the dex build needs are there
      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Build routing helper (AppRoute.java -> approute.dex)
        run: sh route/build_dex.sh

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # CI builds a debug APK and an unsigned release APK. Releases only carry the release APK signed with the developer's key
      # on the developer's own machine (the key never goes to CI), uploaded by hand.
      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: splitaudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (unsigned; signed later on the developer's machine)
        run: gradle --no-daemon --console=plain assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: splitaudio-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
